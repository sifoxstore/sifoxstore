<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiFox Store — পার্সেল ও অর্ডার ট্র্যাকিং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Hind Siliguri', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-sky-600 text-white p-6 text-center relative">
            <a href="index.html" class="absolute left-4 top-5 text-sky-200 hover:text-white text-sm font-semibold flex items-center gap-1">
                ← স্টোরে ফিরুন
            </a>
            <div class="text-3xl mb-1">🚚</div>
            <h1 class="text-xl font-bold tracking-tight">অর্ডার ও শিপমেন্ট ট্র্যাক করুন</h1>
            <p class="text-xs text-sky-100 mt-1">অর্ডার নম্বর ও মোবাইল নম্বর দিয়ে রিয়েল-টাইম কুরিয়ার আপডেট দেখুন</p>
        </div>

        <div class="p-6">
            <form id="f" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">অর্ডার নম্বর *</label>
                    <input id="order" type="text" required placeholder="যেমন: SF-74291" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm uppercase focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">গ্রাহকের মোবাইল নম্বর *</label>
                    <input id="phone" type="tel" required placeholder="০১XXXXXXXXX" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded-xl shadow-md transition text-sm">
                    ট্র্যাক করুন 🔍
                </button>
            </form>

            <div id="result" class="mt-6 min-h-[30px]"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const c = window.SIFOX_CONFIG || {};
        const isConfigured = window.supabase && c.SUPABASE_URL && !c.SUPABASE_URL.includes("YOUR_PROJECT");
        const db = isConfigured ? window.supabase.createClient(c.SUPABASE_URL, c.SUPABASE_ANON_KEY) : null;
        const $ = x => document.getElementById(x);

        const labels = {
            pending: "অপেক্ষমাণ",
            confirmed: "কনফার্ম",
            processing: "প্রসেসিং (প্যাকিং সম্পন্ন)",
            shipped: "শিপড (কুরিয়ারে হস্তান্তর)",
            delivered: "ডেলিভারি সম্পন্ন",
            cancelled: "বাতিল"
        };

        const colors = {
            pending: "bg-slate-100 text-slate-800 border-slate-300",
            confirmed: "bg-blue-50 text-blue-800 border-blue-200",
            processing: "bg-amber-50 text-amber-800 border-amber-200",
            shipped: "bg-purple-50 text-purple-800 border-purple-200",
            delivered: "bg-emerald-50 text-emerald-800 border-emerald-200",
            cancelled: "bg-red-50 text-red-800 border-red-200"
        };

        $("f").onsubmit = async e => {
            e.preventDefault();
            $("result").innerHTML = '<p class="text-slate-500 text-center py-4 text-xs font-semibold">তথ্য খোঁজা হচ্ছে...</p>';

            const orderNum = $("order").value.trim().toUpperCase();
            const phone = $("phone").value.trim();

            if (!db) {
                // Demo fallback check
                $("result").innerHTML = `
                    <div class="border border-slate-200 bg-slate-50 rounded-xl p-4 space-y-2 text-sm">
                        <div class="flex items-center justify-between border-b pb-2">
                            <h2 class="font-bold text-slate-900">অর্ডার #${orderNum}</h2>
                            <span class="text-xs font-bold px-2 py-0.5 rounded border bg-blue-50 text-blue-700">কনফার্ম</span>
                        </div>
                        <p class="text-xs text-slate-600">কুরিয়ার ট্র্যাকিং কোড: <b class="text-slate-900 font-mono">SFBD-9923841</b></p>
                        <p class="text-xs text-slate-600">ডেলিভারি জোন: <b>ঢাকার ভেতরে (৳৮০)</b></p>
                        <p class="text-xs text-slate-600">সর্বমোট প্রদেয়: <b class="text-sky-600 font-bold">৳২,৮৫০</b></p>
                        <p class="text-[11px] text-slate-400">তারিখ: ${new Date().toLocaleString("bn-BD")}</p>
                    </div>
                `;
                return;
            }

            try {
                const { data, error } = await db.rpc("track_order", {
                    p_order_number: orderNum,
                    p_phone: phone
                });

                if (error || !data || !data.length) {
                    $("result").innerHTML = `
                        <div class="p-4 bg-red-50 text-red-700 text-xs font-semibold rounded-xl border border-red-200 text-center">
                            ❌ কোনো অর্ডার পাওয়া যায়নি। অনুগ্রহ করে আপনার অর্ডার নম্বর ও মোবাইল নম্বর সঠিকভাবে যাচাই করুন।
                        </div>
                    `;
                    return;
                }

                const o = data[0];
                const statusLabel = labels[o.status] || o.status;
                const statusColor = colors[o.status] || "bg-slate-100 text-slate-800";

                $("result").innerHTML = `
                    <div class="border border-slate-200 rounded-xl p-5 space-y-3 bg-white shadow-sm">
                        <div class="flex items-center justify-between border-b pb-2">
                            <div>
                                <h2 class="font-extrabold text-slate-900 text-base">অর্ডার #${o.order_number}</h2>
                                <p class="text-xs text-slate-500">${o.customer_name || 'গ্রাহক'}</p>
                            </div>
                            <span class="text-xs font-bold px-2.5 py-1 rounded-lg border ${statusColor}">
                                ${statusLabel}
                            </span>
                        </div>
                        <div class="space-y-1 text-xs text-slate-700">
                            <p>কুরিয়ার ট্র্যাকিং নম্বর: <b class="font-mono text-slate-900">${o.tracking_number || "এখনো জেনারেট হয়নি"}</b></p>
                            <p>ডেলিভারি এলাকা: <b>${o.delivery_zone === 'inside_dhaka' ? 'ঢাকার ভেতরে (৳৮০)' : 'ঢাকার বাইরে (৳১৪০)'}</b></p>
                            <p>সর্বমোট টাকা: <b class="text-sky-600 font-bold text-sm">৳${Number(o.total_amount).toLocaleString("en-US")}</b></p>
                            <p class="text-slate-400">অর্ডারের তারিখ: ${new Date(o.created_at).toLocaleString("bn-BD")}</p>
                        </div>
                    </div>
                `;
            } catch (err) {
                $("result").innerHTML = `<div class="p-4 bg-red-50 text-red-700 text-xs text-center rounded-xl">${err.message}</div>`;
            }
        };
    </script>
</body>
</html>
